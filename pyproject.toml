[project]
name = "hanji-workspace"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "hanji-contracts",
    "hanji",
    # onnxruntime은 macOS x86_64 휠이 없다: 그 컴퓨터에서만 OCR·레이아웃 extra 없이 설치한다(PEP 508 표시에 not이 없어
    # 드모르간으로 적는다)
    "hanji[ocr,layout]; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "hanji-fonts",
]

[tool.uv]
package = false

[tool.uv.sources]
hanji-contracts = { workspace = true }
hanji = { workspace = true }
hanji-fonts = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = ["pytest>=8.3", "jsonschema>=4.23,<5", "reportlab>=5,<6"]

[tool.pytest.ini_options]
testpaths = ["packages/contracts/tests", "packages/engine/tests", "packages/fonts/tests"]
addopts = "--import-mode=importlib -m 'not stress'"
markers = ["stress: 오래 도는 동시성 반복(CI 기본 밖, `pytest -m stress`로 돌린다)"]
filterwarnings = ["error::EncodingWarning", "ignore::EncodingWarning:pypdfium2_raw"]
