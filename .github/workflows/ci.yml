name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

concurrency:
  # PR은 브랜치별 그룹이라 새 커밋이 이전 실행을 취소한다. develop·main 푸시는 실행마다 그룹이 달라 커밋마다 결과가 남는다
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # 기본 인코딩(Windows cp949)에 기대는 open()·read_text()를 경고로 드러내고 아래 -W로 실패시킨다
      PYTHONWARNDEFAULTENCODING: "1"
      # 모델 파일이 없어 건너뛸 테스트를 실패로(모델은 아래 캐시·fetch가 준비한다)
      HANJI_CI_REQUIRE_MODELS: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      # ubuntu에는 한글 글꼴을 설치하지 않는다: 워크스페이스의 hanji-fonts가 PDFium에 등록되는지 검증한다
      # (번들 없을 때 가드는 test_pdf_fonts가 하위 프로세스로 검증)
      - name: Sync
        run: uv sync --locked
      # 모델 파일은 저장소에 없다(업스트림 고정 주소, models.toml): 목록 해시를 열쇠로 캐시하고 캐시가 없을 때만 받는다
      - name: Model cache location
        run: echo "HANJI_CACHE_DIR=${{ runner.temp }}/hanji-models" >> "$GITHUB_ENV"
      - name: Model cache
        id: model-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/hanji-models
          key: models-${{ runner.os }}-${{ hashFiles('packages/engine/src/hanji/models/models.toml') }}
          # 목록이 바뀌면 이전 캐시에서 시작한다: fetch가 맞는 파일은 두고 바뀐 파일만 받는다
          restore-keys: models-${{ runner.os }}-
      - name: Fetch models
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: uv run hanji models fetch
      # 받은 직후에 저장한다: 뒤의 테스트가 실패해도 다음 실행이 다시 받지 않게(actions/cache는 작업이 성공해야 저장한다)
      - name: Save model cache
        if: steps.model-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/hanji-models
          key: ${{ steps.model-cache.outputs.cache-primary-key }}
      # 워크스페이스는 OCR·레이아웃 추가 설치(hanji[ocr,layout])까지 깐다: onnxruntime 휠이 세 OS에 있고 모델이 열리는지 본다
      - name: OCR runtime loads
        run: uv run python -W error::EncodingWarning -c "from hanji.formats.pdf import ocr; ocr.get_reader(); print('ocr ok')"
      # 레이아웃 추가 설치(hanji[layout])와 모델(위 Fetch models가 받은 공식 ONNX 130MB)이 세 OS에서 열리는지 본다
      - name: Layout runtime loads
        run: uv run python -W error::EncodingWarning -c "from hanji.formats.pdf import layout; layout.get_detector(); print('layout ok')"
      # HWPX 골든은 zip 헤더 바이트까지 비교한다: OS마다 달라지는 값(만든 OS 표시 등)이 있으면 전체 테스트보다 먼저 드러나게 둔다
      - name: Engine HWPX fixtures up to date
        run: uv run python -W error::EncodingWarning packages/engine/tests/build_hwpx_fixtures.py --check
      # DOCX 골든도 zip 헤더 바이트까지 비교한다(HWPX와 같은 이유로 전체 테스트보다 먼저)
      - name: Engine OOXML fixtures up to date
        run: uv run python -W error::EncodingWarning packages/engine/tests/build_ooxml_fixtures.py --check
      - name: Tests
        # EncodingWarning 오류화는 pyproject filterwarnings가 한다. 명령줄 -W는 그 안의 pypdfium2 예외 필터를 덮어쓰므로 쓰지 않는다
        env:
          # 리눅스에만 준다(env에는 if를 못 쓴다): 시스템 한글 글꼴이 생겨 번들 없음 가드 시험이 건너뛰어지면 실패시킨다
          HANJI_CI_NO_KOREAN_FONT: ${{ runner.os == 'Linux' && '1' || '' }}
        run: uv run pytest -q
      - name: Contract schemas up to date
        run: uv run python -W error::EncodingWarning -m hanji_contracts.schema --check
      - name: Contract fixtures up to date
        run: uv run python -W error::EncodingWarning packages/contracts/tests/build_fixtures.py --check
      - name: Engine fixtures up to date
        run: uv run python -W error::EncodingWarning packages/engine/tests/build_fixtures.py --check
      - name: Engine PDF fixtures up to date
        run: uv run python -W error::EncodingWarning packages/engine/tests/build_pdf_fixtures.py --check
