# 평가 도구 잠금(tools/eval/uv.lock)의 모든 배포판. 판은 잠금과 같아야 하고 declared(배포판이 밝힌 식)와 bundled(묶인
# 구성 요소)의 spdx는 허용 목록 안이어야 한다(test_licenses, 컨트롤러 판정 R4·R4a). bundled.status: allowed(허용 목록),
# or-alternative(branch로 고른 허용 쪽), runtime-exception(GCC 예외 등), weak-copyleft-library(고치지도 들여오지도 않는
# 남의 휠의 LGPL·MPL), optional-not-shipped(SBOM에만 있고 설치 파일에 없음: absent의 glob이 비어야 한다),
# build-only(빌드 스크립트, 바이너리에 들지 않음). evidence는 site-packages 기준 파일·절.
# wheel_tags(WHEEL 파일 Tag: 값에 맞추는 fnmatch 패턴): 배포판 줄에서는 묶인 줄을 적은 휠(설치된 플랫폼 휠이 맞지 않으면
# 시험이 실패한다), 묶인 줄에서는 그 줄이 맞는 휠(없으면 모든 휠). 적은 휠: macOS arm64는 eval venv(cp312), Linux x86_64는
# tools/eval/uv.lock에 고정된 cp312 manylinux 휠(sha256 확인 뒤 메타데이터·SBOM·고지 파일만 읽음).

